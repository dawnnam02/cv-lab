# 처리 담당 (T4b · T7–T12) 열람 금지. 판정 시험 개발용 목록 (청사진 §5.2)
# 작성: T5 (기준모델 담당 T5 인스턴스), 2026-10-27. 설명 문서: docs/판정-시나리오.md · 계산: scripts/scenario_expected.py
# 강도 값은 모두 "시험용 가정, 측정값 아님". 고른 이유는 문서 §3.
# 위치 loc_rel = [u, v]: 물체 경계 상자 (제외 종류 뺀 압출 + 선폭 반) 기준 상대값, u = X 방향, v = Y 방향, 0–1.
# 층 *_rel: 0 = 첫 층, 1 = 마지막 층. 층 번호 = round(rel × (층 수 − 1)).
# 평가용 (블라인드) 세트는 여기에 없음. 팀장이 T3 때 따로 만듦 (문서 §8).
version: 1
truth_rule: "pass ⇔ truth_pass_pct ≥ 95 (U = 0, 칸 0.2 mm, 전체 층 합산 D-08, 측정 당시 D-06). T1 A19 ④"
kinds:
  z_offset:
    params: {dz_um: "출력 전체 높이 이동, + = 높음"}
    delta_true: "Δ = dz (모든 층 · 모든 판정 칸)"
    delta_seen: "Δ_seen = dz. 0점 = 같은 센서의 출력 전 베드 기준 스캔 (명세 0.4): h − h_bed에서 노즐 Z 오프셋이 빠지고 출력 윗면이 베드보다 dz 높은 몫만 남음"
    observable: "yes"
    cause: "첫 층 Z 오프셋 · 베이비스텝을 잘못 맞춤, 첫 층 눌림이 위층까지 이어짐"
    mf: [MF-GCD-03, MF-SYN-13, MF-CAL-10]
  z_scale:
    params: {gain_ppm: "프린터 Z 배율 오차 g (실제 Z = 명령 Z × (1 + g)), ppm"}
    delta_true: "Δ = g × Z_ref(x, y, n)"
    delta_seen: "Δ_seen = g × (Z_ref − z_n − hop + Z_b) ≈ −g × (z_n − Z_ref) (명세 0.4 h = Z_n + d_s, 베드 기준 스캔을 층 스캔과 같은 센서 거리로 하면 Z_b = hop). 꼭대기 층 윗면은 0, 심도 안 낮은 윗면만 −g × 깊이"
    observable: step_gauge_only
    cause: "Z 리드스크루 · 벨트 피치 오차, 스텝 수 설정 오차. 출력과 센서가 같은 Z축으로 움직여 함께 밀림"
    mf: [MF-MEC-04, MF-CAL-05, MF-THM-08]
  local:
    params: {amp_um: "가우시안 높이, − = 함몰 · + = 돌기", sigma_mm: "가우시안 폭", loc_rel: "중심 [u, v]", layer_from_rel: "첫 층", layer_to_rel: "끝 층"}
    delta_true: "꼭대기 층 j ∈ [k_from, k_to]인 칸에 Δ = amp × exp(−r² ÷ 2σ²), r = 칸과 중심 거리 (윗면이 드러나 있는 동안 남음)"
    delta_seen: "Δ_seen = Δ_true (윗면 높이를 직접 봄, 0점 영향 없음)"
    observable: "yes"
    cause: "노즐 막힘 · 블롭 · 냉각 부족 처짐 · 이물"
    mf: [MF-PRC-01, MF-MAT-08, MF-JDG-06]
  warp:
    params: {lift_um: "경계 상자 모서리의 들림"}
    delta_true: "Δ = lift × ρ², ρ² = ((u − 0.5)² + (v − 0.5)²) ÷ 0.5 (가운데 0, 모서리 1). 모든 층"
    delta_seen: "Δ_seen = Δ_true (들린 윗면을 베드 기준 0점에서 봄. 베드 기준 스캔은 출력 밖 베드라 들림이 0점에 안 들어감)"
    observable: "yes"
    cause: "베드 접착 부족 · 수축으로 모서리 들림"
    mf: [MF-PRC-03, MF-THM-05]
  missing_layer:
    params: {layer_rel: "빠진 첫 층", n_layers: "이어 빠진 층 수", radius_mm: "빠진 원 반지름 (크면 층 전체)", loc_rel: "원 중심 [u, v]"}
    delta_true: "회복형: 꼭대기 층 j ∈ [k, k + m − 1]이고 원 안인 칸에 Δ = Z(k − 1) − Z(j) (빠진 두께만큼 낮음). 위층이 덮으면 사라짐"
    delta_seen: "Δ_seen = Δ_true (압출만 멈추고 Z는 맞음 → 보임). 누적형 (Z 건너뜀)은 Z축 오차라 z_scale과 같은 step_gauge_only 무리 (문서 §2)"
    observable: "yes"
    cause: "필라멘트 걸림 · 압출기 미끄러짐으로 한 층 이상 압출 멈춤"
    mf: [MF-PRC-02, MF-SYN-07, MF-JDG-06]
  extrusion:
    params: {dz_um: "윗면 일정 이동", ripple_um: "결 진폭", ripple_period_mm: "결 주기 (45° 방향)"}
    delta_true: "Δ = dz + ripple × sin(2π (x + y) ÷ (√2 × 주기))"
    delta_seen: "Δ_seen = Δ_true. 결은 판정 칸 평균으로 줄어듦 (T15 M13)"
    observable: "yes"
    cause: "압출량 과다 · 부족 (흐름 배율 · 필라멘트 지름), 비드 결"
    mf: [MF-GCD-01, MF-GCD-02, MF-JDG-04]
