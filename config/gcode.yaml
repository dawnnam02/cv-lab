# G코드 해석 설정 (T4a). 읽는 곳: cvlab.gcode.GCodeParams.from_yaml
# 모르는 키는 오류. 값마다 근거를 적는다.
gcode:
  arc_seg_mm: 0.1              # G1 결정: 원호 현 길이 상한 (처짐 s²/8r, r=2 mm에서 0.6 µm)
  g9x_sets_e: true             # G1 결정 (Marlin 동작: G90/G91이 E 모드도 바꿈). Klipper는 docs/G코드-해석.md §2 [확인 필요]
  strict_unknown: true         # MF-GCD-04: 모르는 명령이 압출 사이에 있으면 멈춤
  allow_commands: []           # 예: [{name: TIMELAPSE_TAKE_FRAME, reason: "사진 뒤 위치 복귀"}] 이유 필수
  layer_source: both           # both | comment | z  (MF-GCD-05)
  layer_z_tol_mm: 0.0001       # 명세 meta.layer_z_mm 규칙
  line_width_mm: null          # 머리말 값 우선. 없으면 실행 때 지정
  filament_diameter_mm: null   # 머리말 값 우선. G2는 실측 평균을 권함
  w_eff_min_len_mm: 0.5        # G2 결정
  width_model: nominal         # G2 결정 (nominal | extrusion)
  height_model: flat           # G3 결정, MF-GCD-01 기본 정의
  grid_res_mm: 0.02            # G3 결정
  grid_margin_mm: 1.0          # 팀장 안
