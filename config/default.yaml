# config/default.yaml — T6 소유 절 (run · grid · paths · validate). 단위는 키 이름 끝에 적는다.
# judge 절은 config/judge.yaml (T15), gcode 절은 config/gcode.yaml (T4a)에 둔다.
# 숫자마다 근거를 단다 (세부청사진 T6 §6.5).

run:
  random_seed: 42        # J2 결정: 시드 고정 42 (J2-config-reproducibility §결정표)
  spec_version: "1.2"    # docs/하드웨어-데이터-명세.md v1.2 (V-4 재동기화, meta.spec_version 허용 값 {1.0, 1.1, 1.2})

grid:
  res_mm: 0.02           # G3 결정, A2 XY 간격 0.02 mm (명세 truth.heightmap_step_mm "C4 기본 0.02")
  frame: "G"             # 명세 0.4절: 높이는 {G} Z, 베드 면 = 0

paths:
  data_raw: data/raw             # 명세 8절 폴더 트리
  data_processed: data/processed # J1 처리 산출물
  results: results               # J2 결과 폴더 (manifest.json)

validate:
  # 검증기 CLI는 이 파일의 T6 절만 읽고 모르는 키 · 목록 아님을 오류 (종료 코드 2)로 본다 (팀장검증 5차 S-4).
  # enable_rules: 상태 '비활성' 규칙을 켤 ID (--enable-rule과 합침). 명세 v1.0에서 비활성 규칙은 0개.
  enable_rules: []
  # disable_rules: 기본 켬 규칙을 끌 ID (--disable-rule과 합침). 끌 수 있는 것은 D-21 채택 (10-27) 두 개뿐:
  # W-REF-11 = 판정 거부 X4 (bed_bare 교정 ID = 스캔 교정 ID), W-MET-56 = X7 (빠진 층). 둘 다 WARN. 예: [W-MET-56]
  disable_rules: []
