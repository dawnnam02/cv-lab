# 합격 판정 설정 (T15). 규칙 문서: docs/판정-규칙.md
# 모르는 키는 오류입니다. 값을 바꾸면 주석의 근거도 함께 고칩니다.
# R1–R7은 2026-10-27 본인 확정 (D-20). 기본값 일치는 tests/judge/test_judge_confirmed_defaults.py가 확인합니다.
judge:
  T_mm: 0.20               # D-05 확정 (허용 오차)
  U_mm: null               # 실행 때 반드시 지정. 코드·설정에 고정하지 않음 (MF-JDG-01, D-15)
                           # 참고값 (기본 U): GUM 합산 + 열 기울기 제외 약 20.9 µm (D-15). 출처: docs/운영/팀장검증_2차.md §3
  U_source: null           # U의 출처 문자열 (예: "D-15 GUM 열 기울기 제외 20.9 µm, 팀장검증_2차 §3"). 없으면 판정 거부 (MF-JDG-01)
  pass_min_pct: 95         # D-08 (전체 층 합산, 합격점 ≥ 95 %면 합격)
  fail_max_pct: 5          # 청사진 §2.3 (불합격점 > 5 %면 불합격). pass_min_pct + fail_max_pct < 100이면 오류 (J-1)
  valid_min_pct: 90        # D-20 R2 확정 (유효 칸 < 판정 영역의 90 %면 측정 불충분)
  cell_mm: 0.2             # D-20 R1 확정 (주 판정 칸)
  cell_mm_alt: 0.4         # D-20 R1 확정 (함께 보고, MF-JDG-04 비드 간격 약 0.4 mm)
  cell_fill_min: 0.5       # D-20 R6 확정 (영역 고운 칸 중 Δ 있는 비율 ≥ 50 %면 유효 칸)
  region_fill_min: 1.0     # D-20 R6 확정 (묶음 전부가 판정 영역일 때만 영역 칸, MF-JDG-03)
  cell_stat: mean          # D-20 R6 확정 (칸 값은 평균. median은 비교용)
  layer_fail_warn_pct: 50  # D-20 R7 확정 (한 층 불합격점 > 50 %면 층 경고)
  outlier_primary: worse   # D-20 R3 확정 (이상치 제외 전·후 중 덜 유리한 쪽이 주 판정)
  cooled_delta_max_um: 5   # D-20 R4 확정 (ΔT ≤ 5 µm ÷ (α·H), 판정 불변·경고만). 센서 없으면 "판단 못 함" 경고만 (R5)
  cooled_alpha_um_per_m_c: 68  # PLA 열팽창 계수, 청사진 §1.2 (사용자 제시), R4 식에 씀
